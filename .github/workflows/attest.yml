name: Attest release assets

# Gives every published release a build provenance attestation, so anyone can
# verify that main.js and styles.css came from this repository. `main.js` is the
# source here (hand-written CommonJS, no bundler), so the job first proves the
# release assets are byte-identical to the committed files and then attests them.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attest
        required: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      # A release can be published before its asset list has propagated, and the
      # REST lookup by tag has been seen to keep serving the pre-upload state for
      # a while afterwards. `releases/<id>/assets` is the authoritative list, so
      # resolve the id once and read the assets from there.
      - name: Wait for the release assets to appear
        run: |
          set -euo pipefail
          echo "waiting for assets on $TAG"
          for attempt in $(seq 1 20); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')
            count=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq 'length')
            if [ "$count" -ge 3 ]; then
              echo "$count assets are listed on release $id"
              exit 0
            fi
            echo "attempt $attempt: $count assets so far, retrying in 15s"
            sleep 15
          done
          echo "::error::$TAG still lists no assets after five minutes"
          exit 1

      - name: Download the published release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[] | "\(.id) \(.name)"' |
            while read -r asset_id name; do
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                -H "Accept: application/octet-stream" > "release-assets/$name"
              echo "downloaded $name"
            done
          ls -la release-assets

      - name: Check the assets match the committed files
        run: |
          set -euo pipefail
          for f in main.js manifest.json styles.css; do
            cmp "$f" "release-assets/$f"
            echo "$f matches the committed file"
          done

      - name: Verify the core logic still passes
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css
