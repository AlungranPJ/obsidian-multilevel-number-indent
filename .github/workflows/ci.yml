name: CI

# main.js is hand-written CommonJS with no bundler, so `npm run build` only checks
# the shipped files are ready; `npm test` runs the assertions. main.js has no bundler
# and no runtime dependencies, and test/core.test.js stubs the host modules so it
# loads in plain Node. A green run means the committed main.js behaves as the
# README documents.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Check the entry file parses
        run: node --check main.js
      - name: Build (check the shipped files)
        run: npm run build
      - name: Run the assertions
        run: npm test
