  <text x="72" y="662" font-family="'Segoe UI', 'Leelawadee UI', ui-sans-serif, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#52525b">Every format is set per level in Settings, and previewed as you type.</text>
